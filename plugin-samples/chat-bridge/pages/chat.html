<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>对话桥</title>
  <link rel="stylesheet" href="/__aicode/theme.css">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--aicode-page-bg, var(--aicode-bg, #ffffff));
      color: var(--aicode-on-surface, #1f2328);
      overflow: hidden;
    }
    .app {
      position: fixed;
      inset: 0;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--aicode-page-bg, var(--aicode-bg, #ffffff));
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 10px;
    }
    h1 { margin: 0; font-size: 19px; line-height: 1.3; }
    .subtitle {
      margin: 3px 0 0;
      color: var(--aicode-subtle-text, var(--aicode-on-surface-variant, #59636e));
      font-size: 12px;
    }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .status {
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--aicode-surface, #f6f8fa);
      color: var(--aicode-subtle-text, var(--aicode-on-surface-variant, #59636e));
      font-size: 11px;
    }
    .status.busy { color: var(--aicode-primary, #0969da); }
    .status.error { color: var(--aicode-error, #cf222e); }
    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      font-family: inherit;
      background: var(--aicode-primary, #0969da);
      color: var(--aicode-on-primary, #ffffff);
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    button.ghost {
      background: transparent;
      color: var(--aicode-on-surface, #1f2328);
      border-color: var(--aicode-outline, #d0d7de);
      padding: 7px 11px;
      font-size: 12px;
    }
    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .empty {
      margin: auto;
      max-width: 360px;
      padding: 20px;
      text-align: center;
      color: var(--aicode-subtle-text, var(--aicode-on-surface-variant, #59636e));
      font-size: 13px;
      line-height: 1.7;
    }
    .empty strong { color: var(--aicode-on-surface, #1f2328); }
    .bubble {
      max-width: 86%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      position: relative;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--aicode-primary, #0969da);
      color: var(--aicode-on-primary, #ffffff);
      border-bottom-right-radius: 4px;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--aicode-surface, #f6f8fa);
      border: 1px solid var(--aicode-outline, #d0d7de);
      border-bottom-left-radius: 4px;
    }
    .bubble.assistant .copy {
      display: block;
      margin-top: 6px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--aicode-primary, #0969da);
      font-size: 11px;
      text-align: left;
    }
    .bubble.error { border-color: var(--aicode-error, #cf222e); }
    .tool-row {
      align-self: center;
      max-width: 90%;
      color: var(--aicode-subtle-text, var(--aicode-on-surface-variant, #59636e));
      font-size: 11px;
      text-align: center;
    }
    .tool-row.pending { color: var(--aicode-primary, #0969da); }
    .tool-row.error { color: var(--aicode-error, #cf222e); }
    .hint {
      margin: 0 16px;
      padding: 9px 11px;
      border-radius: 10px;
      background: var(--aicode-surface, #f6f8fa);
      color: var(--aicode-subtle-text, var(--aicode-on-surface-variant, #59636e));
      font-size: 11px;
      line-height: 1.55;
    }
    .hint summary { cursor: pointer; user-select: none; }
    .hint code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
    }
    .permission {
      margin: 0 16px 10px;
      padding: 12px;
      border: 1px solid var(--aicode-warning, #9a6700);
      border-radius: 12px;
      background: var(--aicode-warning-soft, rgba(154, 103, 0, 0.12));
    }
    .permission h2 { margin: 0 0 4px; font-size: 14px; }
    .permission p {
      margin: 0 0 8px;
      color: var(--aicode-subtle-text, var(--aicode-on-surface-variant, #59636e));
      font-size: 12px;
      line-height: 1.5;
    }
    .permission pre {
      max-height: 120px;
      margin: 0 0 10px;
      padding: 8px;
      overflow: auto;
      border-radius: 8px;
      background: var(--aicode-surface, #f6f8fa);
      color: var(--aicode-on-surface, #1f2328);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .permission-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .permission-actions button {
      padding: 7px 12px;
      font-size: 12px;
    }
    .permission-actions button.deny {
      background: transparent;
      color: var(--aicode-error, #cf222e);
      border-color: var(--aicode-error, #cf222e);
    }
    .permission-error {
      margin-top: 8px;
      color: var(--aicode-error, #cf222e);
      font-size: 12px;
    }
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }
    textarea {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      padding: 11px 12px;
      border: 1px solid var(--aicode-outline, #d0d7de);
      border-radius: 12px;
      background: var(--aicode-card-surface, var(--aicode-surface, #ffffff));
      color: inherit;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
    }
    textarea:focus { border-color: var(--aicode-primary, #0969da); }
    .composer-actions { display: flex; gap: 6px; flex-shrink: 0; }
    @media (max-width: 520px) {
      header { padding-top: 12px; }
      .subtitle { display: none; }
      .status { max-width: 110px; }
      .bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>对话桥</h1>
        <p class="subtitle">给 AI 下指令，读取回复；可作为 QQ / 微信机器人接入示例</p>
      </div>
      <div class="header-actions">
        <span id="status" class="status">连接中…</span>
        <button id="new-session" class="ghost" type="button">新会话</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <section id="permission" class="permission" hidden></section>

    <details class="hint">
      <summary>接入提示：外部消息如何变成 AI 回复</summary>
      外部消息到达后调用 <code>aicode.chat.sendMessage(sessionId, text)</code>；<code>agent.run.finished</code> hook 会通知页面；随后调用 <code>aicode.chat.listMessages</code>，把最后一条 assistant 文本回传给 QQ / 微信。页面关闭后轮询停止，机器人服务应改用插件进程或自己的后端常驻。
    </details>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="输入指令，例如：列出当前目录并总结项目结构"></textarea>
      <div class="composer-actions">
        <button id="stop" class="ghost" type="button" hidden>停止</button>
        <button id="send" type="button">发送</button>
      </div>
    </footer>
  </div>

  <script src="/__aicode/aicode.js"></script>
  <script>
    (function () {
      'use strict';

      var STORAGE_PATH = 'data://chat-bridge.json';
      var POLL_MS = 1000;
      var IDLE_FINISH_MS = 10000;
      var MAX_MESSAGES = 300;

      var sessionId = null;
      var messages = [];
      var lastTimestamp = 0;
      var pending = false;
      var runFinished = false;
      var sawAssistantSinceSend = false;
      var lastActivityAt = 0;
      var pageVisible = true;
      var polling = false;
      var initializing = false;
      var optimisticId = null;
      var turnId = 0;
      var permissionRequests = [];
      var resolvingPermission = false;
      var permissionError = '';

      var statusEl = document.getElementById('status');
      var messagesEl = document.getElementById('messages');
      var permissionEl = document.getElementById('permission');
      var inputEl = document.getElementById('input');
      var sendButton = document.getElementById('send');
      var stopButton = document.getElementById('stop');
      var newSessionButton = document.getElementById('new-session');

      function apiReady() {
        return window.aicode && aicode.chat;
      }

      function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (kind ? ' ' + kind : '');
      }

      function updateButtons() {
        sendButton.disabled = !apiReady() || pending;
        stopButton.hidden = !pending;
      }

      function addSystem(text, kind) {
        messages.push({
          id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2),
          role: 'system',
          content: text,
          timestamp: Date.now(),
          local: true,
          error: kind === 'error'
        });
        render();
      }

      function queuePermission(payload) {
        if (!payload || !payload.requestId || !sessionId) return;
        if (payload.sessionId && payload.sessionId !== sessionId) return;
        if (permissionRequests.some(function (item) { return item.requestId === payload.requestId; })) return;
        permissionRequests.push(payload);
        permissionError = '';
        pending = true;
        setStatus('等待授权：' + (payload.toolName || '工具'), 'busy');
        render();
        renderPermission();
      }

      function removePermission(requestId) {
        permissionRequests = permissionRequests.filter(function (item) {
          return item.requestId !== requestId;
        });
        renderPermission();
      }

      function clearPermissions() {
        permissionRequests = [];
        permissionError = '';
        renderPermission();
      }

      function renderPermission() {
        permissionEl.textContent = '';
        if (!permissionRequests.length) {
          permissionEl.hidden = true;
          return;
        }
        permissionEl.hidden = false;
        var request = permissionRequests[0];
        var card = document.createElement('div');

        var title = document.createElement('h2');
        title.textContent = '需要授权：' + (request.toolName || '工具');
        card.appendChild(title);

        var desc = document.createElement('p');
        desc.textContent = 'AI 想调用这个工具。允许只对本次调用生效；拒绝后 AI 会收到失败结果。';
        card.appendChild(desc);

        var args = '';
        try {
          args = JSON.stringify(request.arguments || {}, null, 2);
        } catch (error) {
          args = String(request.arguments || '');
        }
        if (args.length > 2000) args = args.slice(0, 2000) + '\n…';
        var pre = document.createElement('pre');
        pre.textContent = args;
        card.appendChild(pre);

        if (permissionError) {
          var errorRow = document.createElement('div');
          errorRow.className = 'permission-error';
          errorRow.textContent = permissionError;
          card.appendChild(errorRow);
        }

        var actions = document.createElement('div');
        actions.className = 'permission-actions';
        var deny = document.createElement('button');
        deny.type = 'button';
        deny.className = 'deny';
        deny.textContent = '拒绝';
        deny.disabled = resolvingPermission;
        deny.addEventListener('click', function () {
          resolvePermission(request.requestId, 'deny');
        });
        var allow = document.createElement('button');
        allow.type = 'button';
        allow.textContent = resolvingPermission ? '处理中…' : '允许本次';
        allow.disabled = resolvingPermission;
        allow.addEventListener('click', function () {
          resolvePermission(request.requestId, 'allow');
        });
        actions.appendChild(deny);
        actions.appendChild(allow);
        card.appendChild(actions);
        permissionEl.appendChild(card);
      }

      async function resolvePermission(requestId, decision) {
        if (resolvingPermission) return;
        if (!apiReady() || typeof aicode.invoke !== 'function') {
          permissionError = '当前 APK 不支持插件代审核。';
          renderPermission();
          return;
        }
        resolvingPermission = true;
        permissionError = '';
        renderPermission();
        try {
          var result = await aicode.invoke('ui.permissionDecision', {
            requestId: requestId,
            decision: decision
          });
          if (!result || result.ok !== true) {
            throw new Error((result && result.error) || 'REVIEW_NOT_FOUND');
          }
          removePermission(requestId);
          setStatus(decision === 'allow' ? '已允许，等待 AI 继续…' : '已拒绝，等待 AI 处理…', 'busy');
        } catch (error) {
          permissionError = '处理失败：' + (error.message || error);
        } finally {
          resolvingPermission = false;
          renderPermission();
        }
      }

      async function syncPendingReviews() {
        if (!apiReady() || typeof aicode.invoke !== 'function' || !sessionId) return;
        try {
          var result = await aicode.invoke('ui.pageReady', {});
          var list = (result && result.pendingReviews) || [];
          list.forEach(queuePermission);
        } catch (error) {
          // 运行时不可用时忽略；权限仍由宿主自己的确认 UI 处理。
        }
      }

      function render() {
        messagesEl.textContent = '';
        var visible = messages.filter(function (m) {
          return !m.isCompactionMarker && !m.isContextSummary && !m.isCompacted &&
            (m.role === 'user' || m.role === 'assistant' || m.role === 'tool' || m.role === 'system');
        });

        if (!visible.length && !pending) {
          var empty = document.createElement('div');
          empty.className = 'empty';
          empty.innerHTML = '<strong>对话桥已就绪</strong><br>输入一条指令开始。' +
            '<br>回复会显示在这里，也可以点“复制”交给外部机器人。';
          messagesEl.appendChild(empty);
        }

        visible.forEach(function (message) {
          if (message.role === 'tool') {
            var toolRow = document.createElement('div');
            toolRow.className = 'tool-row';
            toolRow.textContent = '工具 ' + (message.toolName || 'tool') +
              (message.isError ? ' 失败' : ' 完成');
            messagesEl.appendChild(toolRow);
            return;
          }
          if (message.role === 'system') {
            var systemRow = document.createElement('div');
            systemRow.className = 'tool-row' + (message.error ? ' error' : '');
            systemRow.textContent = message.content;
            messagesEl.appendChild(systemRow);
            return;
          }

          var bubble = document.createElement('div');
          bubble.className = 'bubble ' + message.role;
          if (message.error) bubble.classList.add('error');

          var text = document.createElement('div');
          text.className = 'bubble-text';
          text.textContent = message.content || '';
          bubble.appendChild(text);

          if (message.role === 'assistant' && message.content) {
            var copy = document.createElement('button');
            copy.type = 'button';
            copy.className = 'copy';
            copy.textContent = '复制';
            copy.addEventListener('click', function () {
              copyText(message.content, copy);
            });
            bubble.appendChild(copy);
          }
          messagesEl.appendChild(bubble);
        });

        if (pending) {
          var waiting = document.createElement('div');
          waiting.className = 'tool-row pending';
          waiting.textContent = 'AI 正在执行…';
          messagesEl.appendChild(waiting);
        }

        messagesEl.scrollTop = messagesEl.scrollHeight;
        updateButtons();
      }

      function copyText(text, button) {
        function done() {
          var old = button.textContent;
          button.textContent = '已复制';
          setTimeout(function () { button.textContent = old; }, 1200);
        }
        function fallback() {
          var area = document.createElement('textarea');
          area.value = text;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
          document.body.removeChild(area);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, fallback);
        } else {
          fallback();
        }
      }

      function mergeMessages(incoming) {
        if (!incoming || !incoming.length) return false;
        var changed = false;
        incoming.forEach(function (message) {
          if (!message || !message.id) return;
          var index = -1;
          for (var i = 0; i < messages.length; i++) {
            if (messages[i].id === message.id) { index = i; break; }
          }
          if (index >= 0) {
            messages[index] = message;
          } else {
            messages.push(message);
            changed = true;
          }
          if (message.timestamp > lastTimestamp) lastTimestamp = message.timestamp;
          if (message.role === 'assistant' && message.content && message.content.trim()) {
            sawAssistantSinceSend = true;
          }
          if (message.role === 'user' && optimisticId) {
            var optimisticIndex = -1;
            for (var j = 0; j < messages.length; j++) {
              if (messages[j].id === optimisticId) { optimisticIndex = j; break; }
            }
            if (optimisticIndex >= 0 && messages[optimisticIndex].content === message.content) {
              messages.splice(optimisticIndex, 1);
              optimisticId = null;
              changed = true;
            }
          }
        });
        messages.sort(function (a, b) {
          return (a.timestamp || 0) - (b.timestamp || 0);
        });
        if (messages.length > MAX_MESSAGES) {
          messages = messages.slice(-MAX_MESSAGES);
        }
        if (changed) lastActivityAt = Date.now();
        return changed;
      }

      function maybeFinish() {
        if (!pending) return;
        if (runFinished) {
          pending = false;
          setStatus('已完成');
          render();
          return;
        }
        if (sawAssistantSinceSend && Date.now() - lastActivityAt > IDLE_FINISH_MS) {
          pending = false;
          setStatus('已回复（未收到完成事件）');
          render();
        }
      }

      async function pollOnce() {
        if (!apiReady() || !sessionId || !pageVisible || polling) return;
        polling = true;
        try {
          var result = await aicode.chat.listMessages(sessionId, {
            after: lastTimestamp,
            limit: 100
          });
          if (mergeMessages(result.messages || [])) render();
          maybeFinish();
        } catch (error) {
          if (error.code === 'SESSION_NOT_FOUND' || error.code === 'SESSION_FORBIDDEN') {
            try {
              await startFreshSession();
            } catch (freshError) {
              setStatus('会话不可用', 'error');
            }
          } else {
            setStatus('读取失败：' + (error.message || error), 'error');
          }
        } finally {
          polling = false;
        }
      }

      async function readStoredSession() {
        try {
          var result = await aicode.fs.read(STORAGE_PATH);
          var data = JSON.parse(result.content || '{}');
          return data.sessionId || null;
        } catch (error) {
          return null;
        }
      }

      async function storeSession(id) {
        try {
          await aicode.fs.write(STORAGE_PATH, JSON.stringify({
            sessionId: id,
            updatedAt: Date.now()
          }, null, 2));
        } catch (error) {
          // 数据目录不可写时仍允许当前页面继续使用内存中的会话。
        }
      }

      async function loadSession(id) {
        try {
          var result = await aicode.chat.listMessages(id, { limit: 50 });
          sessionId = id;
          messages = (result.messages || []).filter(function (message) {
            return !message.isCompactionMarker && !message.isContextSummary && !message.isCompacted;
          });
          lastTimestamp = 0;
          messages.forEach(function (message) {
            if (message.timestamp > lastTimestamp) lastTimestamp = message.timestamp;
          });
          sawAssistantSinceSend = false;
          runFinished = false;
          pending = false;
          render();
          setStatus('已连接');
          return true;
        } catch (error) {
          if (error.code === 'SESSION_NOT_FOUND' || error.code === 'SESSION_FORBIDDEN') {
            return false;
          }
          throw error;
        }
      }

      async function startFreshSession() {
        var result = await aicode.chat.createSession({ title: '对话桥' });
        sessionId = result.session.id;
        messages = [];
        lastTimestamp = 0;
        pending = false;
        runFinished = false;
        sawAssistantSinceSend = false;
        optimisticId = null;
        clearPermissions();
        await storeSession(sessionId);
        render();
        setStatus('新会话');
        return sessionId;
      }

      async function initialize() {
        if (!apiReady()) {
          setStatus('API 不可用', 'error');
          messages = [{
            id: 'local-api',
            role: 'system',
            content: '当前 APK 没有 aicode.chat 接口，请安装最新版本。',
            timestamp: Date.now(),
            local: true,
            error: true
          }];
          render();
          return;
        }
        if (initializing) return;
        initializing = true;
        try {
          var context = await aicode.context();
          pageVisible = context.visible !== false;
          setStatus('连接中…');
          var stored = await readStoredSession();
          var loaded = stored ? await loadSession(stored) : false;
          if (!loaded) await startFreshSession();
          await pollOnce();
          await syncPendingReviews();
        } catch (error) {
          setStatus('初始化失败', 'error');
          addSystem('初始化失败：' + (error.message || error), 'error');
        } finally {
          initializing = false;
        }
      }

      async function sendMessage() {
        var text = inputEl.value.trim();
        if (!text || pending || !apiReady()) return;
        if (!sessionId) await startFreshSession();

        optimisticId = 'local-' + Date.now();
        messages.push({
          id: optimisticId,
          role: 'user',
          content: text,
          timestamp: Date.now(),
          local: true
        });
        inputEl.value = '';
        pending = true;
        runFinished = false;
        sawAssistantSinceSend = false;
        lastActivityAt = Date.now();
        turnId += 1;
        setStatus('已发送，等待 AI…', 'busy');
        render();

        try {
          await aicode.chat.sendMessage(sessionId, text);
        } catch (error) {
          pending = false;
          messages = messages.filter(function (message) { return message.id !== optimisticId; });
          optimisticId = null;
          inputEl.value = text;
          setStatus('发送失败', 'error');
          addSystem('发送失败：' + (error.message || error), 'error');
        }
      }

      async function stopRun() {
        if (!sessionId || !apiReady()) return;
        try {
          await aicode.chat.stop(sessionId);
          pending = false;
          runFinished = true;
          clearPermissions();
          setStatus('已请求停止');
          addSystem('已请求停止当前 AI 轮次。');
        } catch (error) {
          setStatus('停止失败', 'error');
          addSystem('停止失败：' + (error.message || error), 'error');
        }
      }

      async function newSession() {
        if (!apiReady()) return;
        try {
          await startFreshSession();
        } catch (error) {
          setStatus('新建会话失败', 'error');
          addSystem('新建会话失败：' + (error.message || error), 'error');
        }
      }

      function onRunFinished(payload) {
        if (!payload || payload.sessionId !== sessionId) return;
        var finishedTurn = turnId;
        runFinished = true;
        clearPermissions();
        if (payload.status !== 'success') {
          var reason = payload.errorCode ? ('（' + payload.errorCode + '）') : '';
          addSystem('本轮已结束：' + payload.status + reason, 'error');
        }
        // 完成 hook 之后再做一次拉取，确保最后一条 assistant 消息已经落库。
        setTimeout(function () {
          if (finishedTurn !== turnId) return;
          pollOnce().then(function () {
            if (finishedTurn !== turnId) return;
            pending = false;
            if (payload.status === 'success') {
              setStatus('已完成');
              if (!sawAssistantSinceSend) addSystem('本轮没有文本回复。');
            }
            render();
          });
        }, 300);
      }

      function bindEvents() {
        sendButton.addEventListener('click', sendMessage);
        stopButton.addEventListener('click', stopRun);
        newSessionButton.addEventListener('click', newSession);

        inputEl.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
          }
        });

        if (window.aicode && aicode.events) {
          aicode.events.on(function (event) {
            if (!event) return;
            if (event.name === 'chat.run.finished') {
              onRunFinished(event.payload);
            } else if (event.name === 'chat.permission.requested') {
              queuePermission(event.payload);
            } else if (event.name === 'chat.permission.resolved') {
              removePermission(event.payload && event.payload.requestId);
            } else if (event.name === 'chat.permission.expired') {
              removePermission(event.payload && event.payload.requestId);
              addSystem('审批超时，已交回 App。请返回聊天页确认。', 'error');
              setStatus('审批已交回 App', 'error');
            } else if (event.name === 'ui.lifecycle') {
              var payload = event.payload || {};
              if (payload.reason === 'hidden') {
                pageVisible = false;
              } else if (payload.reason === 'shown' || payload.reason === 'resumed') {
                pageVisible = true;
                pollOnce();
              } else if (payload.reason === 'contextChanged') {
                startFreshSession().catch(function () {
                  setStatus('切换工作区后创建会话失败', 'error');
                });
              }
            }
          });
        }
      }

      bindEvents();
      setInterval(pollOnce, POLL_MS);
      setInterval(maybeFinish, 1000);
      initialize();
    })();
  </script>
</body>
</html>
