<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pet</title>
  <script src="/__aicode/aicode.js"></script>
  <style>
    :root { --pet-scale: .62; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
    }
    .pet-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .pet-scale {
      width: 170px;
      height: 190px;
      flex: none;
      transform: scale(var(--pet-scale));
      transform-origin: 50% 100%;
      transition: transform .28s ease;
    }
    .pet-wrap.edge-left .pet-scale {
      transform-origin: 50% 50%;
      transform: translate(-30px, 36px) rotate(90deg) scale(var(--pet-scale));
    }
    .pet-wrap.edge-right .pet-scale {
      transform-origin: 50% 50%;
      transform: translate(30px, 36px) rotate(-90deg) scale(var(--pet-scale));
    }
    .pet {
      position: relative;
      width: 170px;
      height: 190px;
      transform-origin: 50% 100%;
      animation: breathe 2.8s ease-in-out infinite;
      transition: transform .18s ease;
    }
    .pet.dragging { animation-play-state: paused; transform: scale(1.04); }
    .pet.happy { animation: hop .55s ease; }
    .pet.working { animation: work .65s ease-in-out infinite; }
    .pet.success { animation: hop .55s ease; }
    .pet.error { animation: shake .42s ease; }
    .pet.sleep { opacity: .6; filter: saturate(.65); }
    .pet.sleep .eye { height: 3px; top: 18px; border-radius: 4px; }
    .pet.thinking .eye { animation: blink 1.8s ease-in-out infinite; }
    .pet.thinking .tail { animation: wag .5s ease-in-out infinite; }
    .pet.thinking { animation: think 2.4s ease-in-out infinite; }
    .pet .thought, .pet .tool, .pet .zzz { opacity: 0; transition: opacity .2s ease; }
    .pet .thought {
      position: absolute;
      left: -12px;
      top: 26px;
      display: flex;
      gap: 4px;
    }
    .pet .thought i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
      animation: dot 1.2s ease-in-out infinite;
    }
    .pet .thought i:nth-child(2) { animation-delay: .15s; }
    .pet .thought i:nth-child(3) { animation-delay: .3s; }
    .pet.thinking .thought { opacity: 1; }
    .pet .tool {
      position: absolute;
      right: 10px;
      bottom: 48px;
      width: 32px;
      height: 21px;
      border-radius: 5px;
      background: #5b3420;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .2);
    }
    .pet .tool::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 3px;
      background: #f3d2b4;
    }
    .pet.working .tool { opacity: 1; animation: tool 1s ease-in-out infinite; }
    .pet.success::after {
      content: "✦";
      position: absolute;
      right: 6px;
      top: 4px;
      color: #ffd76a;
      font-size: 30px;
      text-shadow: 0 0 10px rgba(255, 215, 106, .8);
      animation: sparkle .7s ease;
    }
    .pet.error .ear.left { transform: rotate(-48deg) translateY(8px); }
    .pet.error .ear.right { transform: rotate(48deg) scaleX(-1) translateY(8px); }
    .pet.error .body { filter: grayscale(.28); }
    .pet.error .face::after {
      content: "";
      position: absolute;
      right: -2px;
      top: 18px;
      width: 8px;
      height: 12px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: #8fd3ff;
      transform: rotate(18deg);
    }
    .pet.sleep .tail { transform: rotate(38deg); }
    .pet.sleep .zzz { opacity: 1; }
    .pet .zzz {
      position: absolute;
      right: 4px;
      top: 10px;
      color: #fff;
      font: 600 12px/1 system-ui, sans-serif;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .35);
      animation: float 2s ease-in-out infinite;
    }
    .pet .body {
      position: absolute;
      left: 20px;
      top: 54px;
      width: 130px;
      height: 128px;
      border-radius: 50% 50% 44% 44%;
      background: linear-gradient(160deg, #f5b971, #e58b4a);
      box-shadow: inset -10px -12px 0 rgba(120, 62, 24, .12), 0 10px 20px rgba(0, 0, 0, .18);
    }
    .pet .ear {
      position: absolute;
      top: 34px;
      width: 54px;
      height: 66px;
      background: #e58b4a;
      border-radius: 12px 46px 16px 46px;
      transform: rotate(-18deg);
    }
    .pet .ear.left { left: 10px; }
    .pet .ear.right { right: 8px; transform: rotate(18deg) scaleX(-1); }
    .pet .face {
      position: absolute;
      left: 44px;
      top: 84px;
      width: 86px;
      height: 74px;
    }
    .pet .eye {
      position: absolute;
      top: 12px;
      width: 13px;
      height: 18px;
      border-radius: 50%;
      background: #392414;
    }
    .pet .eye.left { left: 12px; }
    .pet .eye.right { right: 12px; }
    .pet .muzzle {
      position: absolute;
      left: 29px;
      top: 34px;
      width: 28px;
      height: 20px;
      border-radius: 50%;
      background: #ffe3c4;
    }
    .pet .nose {
      position: absolute;
      left: 11px;
      top: 6px;
      width: 6px;
      height: 5px;
      border-radius: 50%;
      background: #5b3420;
    }
    .pet .tail {
      position: absolute;
      right: 4px;
      bottom: 30px;
      width: 46px;
      height: 18px;
      border-radius: 18px;
      background: #d97b3b;
      transform-origin: 0 50%;
      transform: rotate(-30deg);
      animation: tail 2.2s ease-in-out infinite;
    }
    .pet .cheek {
      position: absolute;
      top: 46px;
      width: 16px;
      height: 8px;
      border-radius: 50%;
      background: rgba(226, 101, 101, .45);
    }
    .pet .cheek.left { left: 2px; }
    .pet .cheek.right { right: 2px; }
    .hint {
      position: absolute;
      left: 50%;
      top: 30px;
      transform: translateX(-50%);
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(30, 30, 30, .72);
      color: #fff;
      font: 11px/1.3 system-ui, sans-serif;
      opacity: 0;
      transition: opacity .2s ease;
      white-space: nowrap;
    }
    .hint.show { opacity: 1; }
    .state-label {
      position: absolute;
      left: 50%;
      top: 6px;
      transform: translateX(-50%);
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(30, 30, 30, .68);
      color: #fff;
      font: 11px/1.3 system-ui, sans-serif;
      opacity: 0;
      transition: opacity .2s ease;
      white-space: nowrap;
      pointer-events: none;
    }
    .state-label.show { opacity: 1; }
    @keyframes breathe {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      50% { transform: scale(1.025, .975) translateY(3px); }
    }
    @keyframes tail {
      0%, 100% { transform: rotate(-30deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes wag {
      0%, 100% { transform: rotate(-30deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(.08); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-18px) scale(1.06, .94); }
      65% { transform: translateY(0) scale(.98, 1.02); }
    }
    @keyframes work {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    @keyframes think {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(-3deg) translateY(-2px); }
    }
    @keyframes dot {
      0%, 100% { transform: translateY(0); opacity: .55; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes tool {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes sparkle {
      0% { transform: scale(.4) rotate(-20deg); opacity: 0; }
      40% { transform: scale(1.15) rotate(8deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: .9; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: .6; }
      50% { transform: translateY(-5px); opacity: 1; }
    }
  </style>
</head>
<body class="idle">
  <div id="stage">
    <div class="pet-wrap">
      <div class="pet-scale">
        <div class="pet" id="pet">
          <div class="thought"><i></i><i></i><i></i></div>
          <div class="tail"></div>
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="body"></div>
          <div class="tool"></div>
          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="muzzle"></div>
            <div class="nose"></div>
            <div class="cheek left"></div>
            <div class="cheek right"></div>
          </div>
          <div class="zzz">Z z</div>
        </div>
      </div>
    </div>
  </div>
  <div class="hint" id="hint">拖动我</div>
  <div class="state-label" id="stateLabel"></div>

  <script>
    (function () {
      var pet = document.getElementById('pet');
      var wrap = document.querySelector('.pet-wrap');
      var hint = document.getElementById('hint');
      var stateLabel = document.getElementById('stateLabel');
      var hintTimer = 0;
      var selfInfo = { x: 0, y: 0, width: 110, height: 130, density: 1 };

      // 让 170×190 的基准形象适配宿主当前窗口尺寸。
      function fit(width, height) {
        var scale = Math.min(width / 170, height / 190) * 0.95;
        document.documentElement.style.setProperty('--pet-scale', String(scale));
      }

      function setFullDragRegion(width, height) {
        aicode.overlay.setDragRegion({
          left: 0,
          top: 0,
          width: width,
          height: height
        });
      }

      function showHint(text) {
        hint.textContent = text;
        hint.classList.add('show');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(function () { hint.classList.remove('show'); }, 1200);
      }

      function setState(state) {
        console.log('[pet] state', state);
        pet.classList.remove('happy', 'thinking', 'working', 'success', 'error', 'sleep');
        if (state && state !== 'idle') {
          pet.classList.add(state);
        }
        var labels = {
          thinking: '思考中…',
          working: '工作中…',
          success: '完成',
          error: '出错',
          sleep: '休息中'
        };
        stateLabel.textContent = labels[state] || '';
        stateLabel.classList.toggle('show', !!labels[state]);
      }

      (async function () {
        try {
          var self = await aicode.overlay.self();
          selfInfo = self;
          fit(self.width, self.height);
          setFullDragRegion(self.width, self.height);
        } catch (error) {
          // 页面仍可显示，交互会退化为普通 WebView。
          console.error(error);
        }
      })();

      aicode.overlay.onMessage(function (message) {
        if (!message || !message.type) return;
        if (message.type === 'click') {
          pet.classList.remove('happy');
          void pet.offsetWidth;
          pet.classList.add('happy');
          showHint(['喵', '在呢', '摸摸', '今天也要写代码'][Math.floor(Math.random() * 4)]);
        } else if (message.type === 'longPress') {
          aicode.overlay.postMessage({
            type: 'longPress',
            x: selfInfo.x,
            y: selfInfo.y,
            width: selfInfo.width,
            height: selfInfo.height,
            density: selfInfo.density
          }).catch(function () {});
        } else if (message.type === 'hint') {
          showHint(message.text || '');
        } else if (message.type === 'dragStart') {
          wrap.classList.remove('edge-left', 'edge-right');
          pet.classList.add('dragging');
          hint.classList.remove('show');
        } else if (message.type === 'dragEnd') {
          pet.classList.remove('dragging');
        } else if (message.type === 'snap') {
          wrap.classList.remove('edge-left', 'edge-right');
          if (message.edge === 'left' || message.edge === 'right') {
            wrap.classList.add('edge-' + message.edge);
          }
        } else if (message.type === 'resize') {
          fit(message.width, message.height);
          setFullDragRegion(message.width, message.height);
        } else if (message.type === 'state') {
          setState(message.state);
        }
      });
    })();
  </script>
</body>
</html>
