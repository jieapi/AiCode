<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pet</title>
  <script src="/__aicode/aicode.js"></script>
  <style>
    :root { --pet-scale: .62; --pet-width: 110px; --pet-height: 130px; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: absolute;
      inset: 0;
      width: var(--pet-width);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }
    .pet-wrap {
      width: var(--pet-width);
      height: var(--pet-height);
      flex: none;
      box-sizing: border-box;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
    }
    .pet-scale {
      width: 170px;
      height: 190px;
      flex: none;
      transform: scale(var(--pet-scale));
      transform-origin: 50% 100%;
    }
    .pet-pose {
      width: 100%;
      height: 100%;
      transform-origin: 50% 65%;
      transform: translate(0, 0) rotate(0deg);
      transition: transform .44s cubic-bezier(.22, .8, .28, 1.12);
    }
    .pet-wrap.edge-left .pet-pose {
      transform: translate(-24px, 8px) rotate(90deg);
    }
    .pet-wrap.edge-right .pet-pose {
      transform: translate(24px, 8px) rotate(-90deg);
    }
    .pet-wrap.edge-top .pet-pose { transform: translateY(-8px) rotate(180deg); }
    .pet-wrap.edge-bottom .pet-pose { transform: translateY(4px) rotate(0deg); }
    .pet {
      position: relative;
      width: 170px;
      height: 190px;
      transform-origin: 50% 100%;
      animation: breathe 2.8s ease-in-out infinite;
      transition: opacity .4s ease, filter .4s ease;
    }
    .pet.working { animation: work .65s ease-in-out infinite; }
    .pet.error { animation: shake .42s ease; }
    .pet.feeding { animation: eat .65s ease-in-out infinite; }
    .pet.sleep { opacity: .72; filter: saturate(.65); animation: breathe 4.6s ease-in-out infinite; }
    .pet.sleep .eye { height: 3px; top: 18px; border-radius: 4px; animation: none; }
    .pet.sleep .face { animation: none; }
    .pet.happy .tail, .pet.success .tail, .pet.feeding .tail { animation: wag .32s ease-in-out infinite; }
    .pet.feeding .eye { animation: none; transform: scaleY(.5); }
    .pet.feeding .muzzle { animation: chew .32s ease-in-out infinite; }
    .pet.dragging .tail { animation: wag .4s ease-in-out infinite; }
    .pet.thinking .eye { animation: blink 1.8s ease-in-out infinite; }
    .pet.thinking .tail { animation: wag .5s ease-in-out infinite; }
    .pet.thinking { animation: think 2.4s ease-in-out infinite; }
    .pet.happy, .pet.success { animation: hop .75s ease; }
    .pet.dragging { animation: dangle .85s ease-in-out infinite; }
    .pet.landing { animation: land .42s ease-out; }
    .pet .thought, .pet .tool, .pet .zzz, .pet .food { opacity: 0; transition: opacity .2s ease; }
    .pet .thought {
      position: absolute;
      left: -12px;
      top: 26px;
      display: flex;
      gap: 4px;
    }
    .pet .thought i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
      animation: dot 1.2s ease-in-out infinite;
    }
    .pet .thought i:nth-child(2) { animation-delay: .15s; }
    .pet .thought i:nth-child(3) { animation-delay: .3s; }
    .pet.thinking .thought { opacity: 1; }
    .pet .tool {
      position: absolute;
      right: 10px;
      bottom: 48px;
      width: 32px;
      height: 21px;
      border-radius: 5px;
      background: #5b3420;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .2);
    }
    .pet .tool::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 3px;
      background: #f3d2b4;
    }
    .pet.working .tool { opacity: 1; animation: tool 1s ease-in-out infinite; }
    .pet.success::after {
      content: "✦";
      position: absolute;
      right: 6px;
      top: 4px;
      color: #ffd76a;
      font-size: 30px;
      text-shadow: 0 0 10px rgba(255, 215, 106, .8);
      animation: sparkle .7s ease;
    }
    .pet.error .ear.left { transform: rotate(-48deg) translateY(8px); }
    .pet.error .ear.right { transform: rotate(48deg) scaleX(-1) translateY(8px); }
    .pet.error .body { filter: grayscale(.28); }
    .pet.error .face::after {
      content: "";
      position: absolute;
      right: -2px;
      top: 18px;
      width: 8px;
      height: 12px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: #8fd3ff;
      transform: rotate(18deg);
    }
    .pet.sleep .tail { animation: none; transform: rotate(38deg); }
    .pet.sleep .zzz { opacity: 1; }
    .pet .zzz {
      position: absolute;
      right: 4px;
      top: 10px;
      color: #fff;
      font: 600 12px/1 system-ui, sans-serif;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .35);
      animation: float 2s ease-in-out infinite;
    }
    .pet .body {
      position: absolute;
      left: 20px;
      top: 54px;
      width: 130px;
      height: 128px;
      border-radius: 50% 50% 44% 44%;
      background: linear-gradient(160deg, #f5b971, #e58b4a);
      box-shadow: inset -10px -12px 0 rgba(120, 62, 24, .12), 0 10px 20px rgba(0, 0, 0, .18);
    }
    .pet .ear {
      position: absolute;
      top: 34px;
      width: 54px;
      height: 66px;
      background: #e58b4a;
      border-radius: 12px 46px 16px 46px;
      transform: rotate(-18deg);
    }
    .pet .ear.left { left: 10px; transform-origin: 75% 85%; animation: ear-left 7.4s ease-in-out infinite; }
    .pet .ear.right { right: 8px; transform: rotate(18deg) scaleX(-1); transform-origin: 25% 85%; animation: ear-right 7.4s ease-in-out .18s infinite; }
    .pet.error .ear, .pet.sleep .ear { animation: none; }
    .pet.dragging .ear { animation-play-state: paused; }
    .pet .face {
      position: absolute;
      left: 44px;
      top: 84px;
      width: 86px;
      height: 74px;
      animation: look 9s ease-in-out infinite;
    }
    .pet .eye {
      position: absolute;
      top: 12px;
      width: 13px;
      height: 18px;
      border-radius: 50%;
      background: #392414;
      transform-origin: 50% 55%;
      animation: blink 5.6s ease-in-out infinite;
    }
    .pet .eye.left { left: 12px; }
    .pet .eye.right { right: 12px; }
    .pet .muzzle {
      position: absolute;
      left: 29px;
      top: 34px;
      width: 28px;
      height: 20px;
      border-radius: 50%;
      background: #ffe3c4;
    }
    .pet .nose {
      position: absolute;
      left: 11px;
      top: 6px;
      width: 6px;
      height: 5px;
      border-radius: 50%;
      background: #5b3420;
    }
    .pet .paw {
      position: absolute;
      bottom: 5px;
      width: 29px;
      height: 17px;
      border-radius: 50%;
      background: #ffe3c4;
      transform-origin: 50% 100%;
    }
    .pet .paw.left { left: 35px; }
    .pet .paw.right { right: 35px; }
    .pet.working .paw { animation: tap .65s ease-in-out infinite; }
    .pet.working .paw.right { animation-delay: .32s; }
    .pet .food {
      position: absolute;
      left: 57px;
      bottom: 0;
      width: 56px;
      height: 20px;
      border-radius: 4px 4px 22px 22px;
      background: #7dbbb3;
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .12);
    }
    .pet .food::before {
      content: "";
      position: absolute;
      left: 7px;
      top: -4px;
      width: 8px;
      height: 7px;
      border-radius: 50%;
      background: #9a613e;
      box-shadow: 11px -2px 0 #9a613e, 22px 0 0 #9a613e, 32px -1px 0 #9a613e;
    }
    .pet.feeding .food { opacity: 1; }
    .pet .tail {
      position: absolute;
      right: 4px;
      bottom: 30px;
      width: 46px;
      height: 18px;
      border-radius: 18px;
      background: #d97b3b;
      transform-origin: 0 50%;
      transform: rotate(-30deg);
      animation: tail 2.2s ease-in-out infinite;
    }
    .pet .cheek {
      position: absolute;
      top: 46px;
      width: 16px;
      height: 8px;
      border-radius: 50%;
      background: rgba(226, 101, 101, .45);
    }
    .pet .cheek.left { left: 2px; }
    .pet .cheek.right { right: 2px; }
    .hint {
      position: absolute;
      left: 50%;
      top: 30px;
      transform: translateX(-50%);
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(30, 30, 30, .72);
      color: #fff;
      font: 11px/1.3 system-ui, sans-serif;
      opacity: 0;
      transition: opacity .2s ease;
      white-space: nowrap;
    }
    .hint.show { opacity: 1; }
    .state-label {
      position: absolute;
      left: 50%;
      top: 6px;
      transform: translateX(-50%);
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(30, 30, 30, .68);
      color: #fff;
      font: 11px/1.3 system-ui, sans-serif;
      opacity: 0;
      transition: opacity .2s ease;
      white-space: nowrap;
      pointer-events: none;
    }
    .state-label.show { opacity: 1; }
    .menu {
      position: absolute;
      top: calc(var(--pet-height) + 8px);
      left: 8px;
      box-sizing: border-box;
      width: calc(var(--pet-width) - 16px);
      height: 130px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-radius: 14px;
      background: rgba(30, 30, 30, .92);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity .18s ease, transform .18s ease;
    }
    body.menu-ready .menu {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .menu button {
      flex: 1;
      border: 0;
      border-radius: 9px;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .menu button:active { background: rgba(255, 255, 255, .28); }
    .menu button:disabled { pointer-events: none; }
    .menu .menu-close {
      position: absolute;
      right: 9px;
      top: 5px;
      width: 18px;
      height: 18px;
      padding: 0;
      flex: none;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, .6);
      font-size: 16px;
      line-height: 1;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      50% { transform: scale(1.025, .975) translateY(3px); }
    }
    @keyframes tail {
      0%, 100% { transform: rotate(-30deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes wag {
      0%, 100% { transform: rotate(-30deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes blink {
      0%, 42%, 46%, 50%, 54%, 100% { transform: scaleY(1); }
      44%, 52% { transform: scaleY(.08); }
    }
    @keyframes ear-left {
      0%, 68%, 80%, 100% { transform: rotate(-18deg); }
      72%, 77% { transform: rotate(-30deg); }
      74% { transform: rotate(-10deg); }
    }
    @keyframes ear-right {
      0%, 68%, 80%, 100% { transform: rotate(18deg) scaleX(-1); }
      72%, 77% { transform: rotate(30deg) scaleX(-1); }
      74% { transform: rotate(10deg) scaleX(-1); }
    }
    @keyframes look {
      0%, 30%, 70%, 100% { transform: translate(0, 0); }
      38%, 48% { transform: translate(3px, -2px) rotate(2deg); }
      56%, 62% { transform: translate(-2px, 0) rotate(-2deg); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0) scale(1); }
      15% { transform: translateY(2px) scale(1.05, .9); }
      40% { transform: translateY(-21px) scale(.95, 1.06) rotate(-3deg); }
      65% { transform: translateY(1px) scale(1.08, .91); }
      82% { transform: translateY(-4px) scale(.99, 1.02); }
    }
    @keyframes dangle {
      0%, 100% { transform: translateY(-3px) rotate(-5deg) scale(.97, 1.04); }
      50% { transform: translateY(-1px) rotate(5deg) scale(1.01, 1.02); }
    }
    @keyframes land {
      0% { transform: translateY(-3px) scale(.97, 1.04); }
      38% { transform: translateY(3px) scale(1.08, .9); }
      72% { transform: translateY(-2px) scale(.98, 1.03); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes eat {
      0%, 100% { transform: translateY(1px) rotate(-2deg); }
      50% { transform: translateY(5px) scale(1.025, .98) rotate(2deg); }
    }
    @keyframes chew {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12, .85); }
    }
    @keyframes tap {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-8px) rotate(-10deg); }
    }
    @keyframes work {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    @keyframes think {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(-3deg) translateY(-2px); }
    }
    @keyframes dot {
      0%, 100% { transform: translateY(0); opacity: .55; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes tool {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes sparkle {
      0% { transform: scale(.4) rotate(-20deg); opacity: 0; }
      40% { transform: scale(1.15) rotate(8deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: .9; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: .6; }
      50% { transform: translateY(-5px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body class="idle">
  <div id="stage">
    <div class="pet-wrap">
      <div class="pet-scale">
        <div class="pet-pose">
          <div class="pet" id="pet">
            <div class="thought"><i></i><i></i><i></i></div>
            <div class="tail"></div>
            <div class="ear left"></div>
            <div class="ear right"></div>
            <div class="body"></div>
            <div class="paw left"></div>
            <div class="paw right"></div>
            <div class="tool"></div>
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="muzzle"></div>
              <div class="nose"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
            </div>
            <div class="food"></div>
            <div class="zzz">Z z</div>
          </div>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">拖动 / 长按</div>
    <div class="state-label" id="stateLabel"></div>
    <div class="menu" id="menu" aria-hidden="true">
      <button class="menu-close" id="menuClose" aria-label="关闭菜单" title="关闭">×</button>
      <button data-action="feed">喂食</button>
      <button data-action="sleep">休息</button>
      <button data-action="hide">隐藏</button>
    </div>
  </div>

  <script>
    (function () {
      var pet = document.getElementById('pet');
      var wrap = document.querySelector('.pet-wrap');
      var hint = document.getElementById('hint');
      var stateLabel = document.getElementById('stateLabel');
      var menu = document.getElementById('menu');
      var menuButtons = menu.querySelectorAll('button');
      var hintTimer = 0;
      var selfInfo = { x: 0, y: 0, width: 110, height: 130, density: 1 };
      var initialized = false;
      var expanded = false;
      var transitioning = false;
      var petAnchor = null;
      var panelOrigin = null;
      var finishTransition = null;
      var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function applyWindowSize(width, height) {
        selfInfo.width = width;
        selfInfo.height = height;
        var scale = Math.min(width / 170, height / 190) * 0.95;
        document.documentElement.style.setProperty('--pet-scale', String(scale));
        document.documentElement.style.setProperty('--pet-width', width + 'px');
        document.documentElement.style.setProperty('--pet-height', height + 'px');
      }

      function renderMenu() {
        var ready = expanded && !transitioning;
        document.body.classList.toggle('expanded', expanded);
        document.body.classList.toggle('menu-ready', ready);
        menu.setAttribute('aria-hidden', String(!ready));
        menuButtons.forEach(function (button) { button.disabled = !ready; });
      }

      function updateDragRegion() {
        return aicode.overlay.setDragRegion({
          left: 0,
          top: 0,
          width: selfInfo.width,
          height: selfInfo.height
        });
      }

      async function setExpanded(value) {
        if (!initialized || transitioning || expanded === value) return false;
        var previous = expanded;
        transitioning = true;
        renderMenu();
        try {
          if (value) {
            var self = await aicode.overlay.self();
            petAnchor = { x: self.x, y: self.y };
          }
          expanded = value;
          renderMenu();
          await updateDragRegion();
          // resize 调用只确认请求，最终位置与动画完成以 resize 事件为准。
          var completion = new Promise(function (resolve) { finishTransition = resolve; });
          await aicode.overlay.resize(selfInfo.width, selfInfo.height + (value ? 146 : 0), {
            animate: !reducedMotion,
            x: !value && petAnchor ? petAnchor.x : null,
            y: !value && petAnchor ? petAnchor.y : null
          });
          return await completion;
        } catch (error) {
          if (finishTransition) finishTransition(false);
          finishTransition = null;
          transitioning = false;
          expanded = previous;
          renderMenu();
          showHint('菜单调整失败');
          return false;
        }
      }

      function updatePosition(message) {
        if (expanded && panelOrigin && petAnchor) {
          petAnchor.x += message.x - panelOrigin.x;
          petAnchor.y += message.y - panelOrigin.y;
          panelOrigin = { x: message.x, y: message.y };
        } else if (!expanded) {
          petAnchor = { x: message.x, y: message.y };
        }
        selfInfo.x = message.x;
        selfInfo.y = message.y;
      }

      function setEdge(edge) {
        wrap.classList.remove('edge-left', 'edge-right', 'edge-top', 'edge-bottom');
        if (edge) wrap.classList.add('edge-' + edge);
      }

      function showHint(text) {
        hint.textContent = text;
        hint.classList.add('show');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(function () { hint.classList.remove('show'); }, 1200);
      }

      function setState(state) {
        pet.classList.remove('happy', 'landing', 'thinking', 'working', 'success', 'error', 'sleep', 'feeding');
        if (state && state !== 'idle') {
          pet.classList.add(state);
        }
        var labels = {
          thinking: '思考中…',
          working: '工作中…',
          success: '完成',
          error: '出错',
          feeding: '吃饭中',
          sleep: '休息中'
        };
        stateLabel.textContent = labels[state] || '';
        stateLabel.classList.toggle('show', !!labels[state]);
      }

      renderMenu();
      (async function () {
        try {
          var self = await aicode.overlay.self();
          selfInfo = self;
          petAnchor = { x: self.x, y: self.y };
          applyWindowSize(self.width, self.height);
          await updateDragRegion();
          initialized = true;
        } catch (error) {
          console.error(error);
        }
      })();

      document.querySelectorAll('[data-action]').forEach(function (button) {
        button.addEventListener('click', async function () {
          if (!expanded || transitioning) return;
          var action = button.dataset.action;
          if (await setExpanded(false)) {
            aicode.overlay.postMessage({ type: 'menuAction', action: action }).catch(function () {
              showHint('操作失败');
            });
          }
        });
      });
      document.getElementById('menuClose').addEventListener('click', function () {
        void setExpanded(false);
      });

      pet.addEventListener('animationend', function (event) {
        if (event.target !== pet) return;
        if (event.animationName === 'hop') pet.classList.remove('happy');
        if (event.animationName === 'land') pet.classList.remove('landing');
      });

      aicode.overlay.onMessage(function (message) {
        if (!message || !message.type) return;
        if (message.type === 'click') {
          if (transitioning) return;
          if (expanded) {
            void setExpanded(false);
            return;
          }
          pet.classList.remove('happy');
          void pet.offsetWidth;
          pet.classList.add('happy');
          showHint(['喵', '在呢', '摸摸', '今天也要写代码'][Math.floor(Math.random() * 4)]);
        } else if (message.type === 'longPress') {
          void setExpanded(!expanded);
        } else if (message.type === 'hint') {
          showHint(message.text || '');
        } else if (message.type === 'dragStart') {
          setEdge(null);
          pet.classList.remove('landing', 'happy');
          pet.classList.add('dragging');
          hint.classList.remove('show');
        } else if (message.type === 'dragEnd') {
          pet.classList.remove('dragging');
          if (!reducedMotion) pet.classList.add('landing');
          updatePosition(message);
        } else if (message.type === 'snap') {
          if (['left', 'right', 'top', 'bottom'].indexOf(message.edge) !== -1) {
            setEdge(message.edge);
            updatePosition(message);
          }
        } else if (message.type === 'resize') {
          var expected = message.width === selfInfo.width &&
            message.height === selfInfo.height + (expanded ? 146 : 0);
          transitioning = false;
          if (!expected) {
            expanded = false;
            applyWindowSize(message.width, message.height);
          }
          selfInfo.x = message.x;
          selfInfo.y = message.y;
          if (expanded) {
            panelOrigin = { x: message.x, y: message.y };
          } else {
            panelOrigin = null;
            petAnchor = { x: message.x, y: message.y };
          }
          renderMenu();
          updateDragRegion().catch(function () {});
          if (finishTransition) finishTransition(expected);
          finishTransition = null;
        } else if (message.type === 'state') {
          setState(message.state);
        }
      });
    })();
  </script>
</body>
