<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>桌面宠物</title>
  <link rel="stylesheet" href="/__aicode/theme.css">
  <link rel="stylesheet" href="/__aicode/ui.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    [hidden], [v-cloak] { display: none !important; }
    body {
      background: var(--aicode-page-bg);
      color: var(--aicode-on-surface);
      font-family: var(--aicode-font-sans);
      font-size: calc(14px * var(--aicode-font-scale));
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    .page-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 12px 16px 36px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
    }
    .row-main {
      flex: 1;
      min-width: 0;
    }
    .row-title {
      color: var(--aicode-on-surface);
      font-size: calc(16px * var(--aicode-font-scale));
      line-height: 1.4;
    }
    .row-subtitle {
      margin: 2px 0 0;
      color: var(--aicode-on-surface-variant);
      font-size: calc(14px * var(--aicode-font-scale));
      line-height: 1.4;
    }
    .actions {
      display: flex;
      gap: 12px;
      padding: 12px 16px 16px;
    }
    .actions .aicode-button { flex: 1; }
    .field-block { padding: 12px 16px; }
    .field-title {
      margin-bottom: 8px;
      color: var(--aicode-on-surface-variant);
      font-size: calc(13px * var(--aicode-font-scale));
    }
    .hint {
      margin: 0;
      padding: 0 4px;
      color: var(--aicode-on-surface-variant);
      font-size: calc(13px * var(--aicode-font-scale));
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div id="app" class="aicode-page" v-cloak>
  <div class="page-content">
    <aicode-group title="桌面宠物">
      <div class="row">
        <div class="row-main">
          <div class="row-title">{{ statusTitle }}</div>
          <p class="row-subtitle">{{ statusText }}</p>
        </div>
        <aicode-badge :text="running ? '已打开' : '未打开'" :kind="running ? 'enabled' : ''"></aicode-badge>
      </div>
      <aicode-divider></aicode-divider>
      <div class="actions">
        <aicode-button variant="primary" :disabled="busy" @click="showPet">显示桌宠</aicode-button>
        <aicode-button :disabled="busy || !running" @click="hidePet">关闭桌宠</aicode-button>
      </div>
    </aicode-group>

    <aicode-group title="外观">
      <div class="field-block">
        <div class="field-title">大小</div>
        <aicode-segmented
          :model-value="size"
          :options="sizeOptions"
          @update:model-value="onSizeChange"></aicode-segmented>
      </div>
      <aicode-divider></aicode-divider>
      <div class="field-block">
        <div class="field-title">显示时机</div>
        <aicode-segmented
          :model-value="visibilityPolicy"
          :options="visibilityOptions"
          @update:model-value="onVisibilityChange"></aicode-segmented>
      </div>
    </aicode-group>

    <aicode-group title="启动">
      <div class="row">
        <div class="row-main">
          <div class="row-title">随 App 启动显示桌宠</div>
          <p class="row-subtitle">开启后，启用插件或下次启动 AiCode 时自动显示。</p>
        </div>
        <aicode-switch
          :model-value="autoStart"
          @update:model-value="onAutoStartChange"></aicode-switch>
      </div>
    </aicode-group>

    <p class="hint">桌宠由宿主托管悬浮窗显示；需要先在「插件管理」中授予悬浮窗权限，并允许 AiCode 显示在其他应用上层。</p>
  </div>
</div>

<script src="/__aicode/vue.global.prod.js"></script>
<script src="/__aicode/aicode-ui-vue.js"></script>
<script src="/__aicode/aicode.js"></script>
<script>
  (function () {
    'use strict';

    var SETTINGS_PATH = 'data://pet-settings.json';
    var SIZES = {
      small: { width: 90, height: 110 },
      medium: { width: 110, height: 130 },
      large: { width: 150, height: 180 }
    };
    var SIZE_OPTIONS = [
      { value: 'small', label: '小' },
      { value: 'medium', label: '中' },
      { value: 'large', label: '大' }
    ];
    var VISIBILITY_OPTIONS = [
      { value: 'always', label: '始终显示' },
      { value: 'foreground', label: '仅前台' },
      { value: 'background', label: '仅后台' }
    ];
    var STATE_LABELS = {
      idle: '待机',
      thinking: '思考中',
      working: '工作中',
      feeding: '吃饭中',
      success: '开心',
      error: '沮丧',
      sleep: '休息中'
    };

    function toast(message) {
      aicode.toast(message).catch(function () {});
    }

    function errorText(error) {
      return (error && (error.message || error.code)) || '未知错误';
    }

    function sizeOf(width, height) {
      var match = Object.keys(SIZES).find(function (key) {
        return SIZES[key].width === Number(width) && SIZES[key].height === Number(height);
      });
      return match || 'medium';
    }

    var app = Vue.createApp({
      data: function () {
        return {
          autoStart: false,
          size: 'medium',
          visibilityPolicy: 'always',
          overlayId: null,
          petState: 'idle',
          busy: false,
          sizeOptions: SIZE_OPTIONS,
          visibilityOptions: VISIBILITY_OPTIONS
        };
      },
      computed: {
        running: function () {
          return !!this.overlayId;
        },
        statusTitle: function () {
          return this.running ? '桌宠已打开' : '桌宠未打开';
        },
        statusText: function () {
          if (!this.running) return '关闭后可以随时从下方重新打开。';
          return '当前状态：' + (STATE_LABELS[this.petState] || this.petState);
        }
      },
      mounted: function () {
        var self = this;
        this.loadSettings().then(function () {
          return self.refreshStatus();
        });
        this.offLifecycle = aicode.events.on(function (event) {
          if (event && event.name === 'ui.lifecycle' && event.payload && event.payload.visible) {
            self.refreshStatus();
          }
        });
      },
      beforeUnmount: function () {
        if (this.offLifecycle) this.offLifecycle();
      },
      methods: {
        loadSettings: function () {
          var self = this;
          return aicode.fs.read(SETTINGS_PATH).then(function (file) {
            var parsed = {};
            try {
              parsed = JSON.parse((file && file.content) || '{}');
            } catch (e) {
              parsed = {};
            }
            self.autoStart = parsed.autoStart === true;
            self.size = sizeOf(parsed.width, parsed.height);
            self.visibilityPolicy = VISIBILITY_OPTIONS.some(function (option) {
              return option.value === parsed.visibilityPolicy;
            }) ? parsed.visibilityPolicy : 'always';
          }).catch(function () {});
        },
        dimensions: function () {
          return SIZES[this.size] || SIZES.medium;
        },
        saveSettings: function () {
          var dimensions = this.dimensions();
          return aicode.fs.write(SETTINGS_PATH, JSON.stringify({
            autoStart: this.autoStart,
            width: dimensions.width,
            height: dimensions.height,
            visibilityPolicy: this.visibilityPolicy
          }));
        },
        refreshStatus: function () {
          var self = this;
          return aicode.invoke('overlay.status').then(function (status) {
            self.overlayId = (status && status.overlayId) || null;
            self.petState = (status && status.state) || 'idle';
          }).catch(function () {
            self.overlayId = null;
            self.petState = 'idle';
          });
        },
        showPet: function () {
          var self = this;
          if (this.busy) return;
          this.busy = true;
          var dimensions = this.dimensions();
          aicode.overlay.create({
            surface: 'pet',
            width: dimensions.width,
            height: dimensions.height,
            visibilityPolicy: this.visibilityPolicy
          }).then(function (info) {
            self.overlayId = info.overlayId;
            self.petState = 'idle';
            if (info.width !== dimensions.width || info.height !== dimensions.height ||
                info.visibilityPolicy !== self.visibilityPolicy) {
              return aicode.overlay.update(info.overlayId, {
                width: dimensions.width,
                height: dimensions.height,
                visibilityPolicy: self.visibilityPolicy
              });
            }
            return null;
          }).then(function () {
            return aicode.invoke('overlay.created', { overlayId: self.overlayId });
          }).then(function () {
            toast('桌宠已显示');
          }).catch(function (error) {
            self.overlayId = null;
            toast('显示失败：' + errorText(error));
          }).then(function () {
            self.busy = false;
          });
        },
        hidePet: function () {
          var self = this;
          if (this.busy) return;
          this.busy = true;
          aicode.overlay.close(this.overlayId).catch(function (error) {
            if (!error || error.code !== 'OVERLAY_NOT_FOUND') throw error;
          }).then(function () {
            self.overlayId = null;
            self.petState = 'idle';
            return aicode.invoke('overlay.closed').catch(function () {});
          }).then(function () {
            toast('桌宠已关闭');
          }).catch(function (error) {
            toast('关闭失败：' + errorText(error));
          }).then(function () {
            self.busy = false;
          });
        },
        onAutoStartChange: function (value) {
          var self = this;
          this.autoStart = value;
          this.saveSettings().then(function () {
            toast(value ? '已开启随 App 启动' : '已关闭随 App 启动');
          }).catch(function (error) {
            self.autoStart = !value;
            toast('保存设置失败：' + errorText(error));
          });
        },
        onSizeChange: function (value) {
          var self = this;
          var previous = this.size;
          this.size = value;
          var dimensions = this.dimensions();
          this.saveSettings().then(function () {
            if (!self.overlayId) return null;
            return aicode.overlay.update(self.overlayId, {
              width: dimensions.width,
              height: dimensions.height
            });
          }).catch(function (error) {
            self.size = previous;
            toast('调整大小失败：' + errorText(error));
          });
        },
        onVisibilityChange: function (value) {
          var self = this;
          var previous = this.visibilityPolicy;
          this.visibilityPolicy = value;
          this.saveSettings().then(function () {
            if (!self.overlayId) return null;
            return aicode.overlay.update(self.overlayId, { visibilityPolicy: value });
          }).catch(function (error) {
            self.visibilityPolicy = previous;
            toast('调整显示时机失败：' + errorText(error));
          });
        }
      }
    });

    app.use(AicodeUI);
    app.mount('#app');
  })();
</script>
</body>
</html>
