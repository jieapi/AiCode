<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiCode 官方网站 — Android 上的开源 AI Coding Agent</title>
  <meta name="description" content="AiCode 官方网站。运行在 Android 上的通用开源 AI Coding Agent，内置完整 Alpine Linux 容器与多标签终端，支持本地开发与远程 SSH、可视化 Git、MCP 协议与多供应商模型。" />
  <link rel="icon" type="image/webp" href="/assets/icon.webp" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <script>
    // 首屏渲染前恢复主题，避免明暗闪烁
    (function () {
      try {
        var theme = localStorage.getItem("aicode-site-theme");
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
