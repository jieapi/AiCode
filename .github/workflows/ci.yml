name: CI

# push 到 main 或 PR 时触发：构建 universal debug（单 flavor 冒烟）+ 跑单元测试。
# 目的是合入前的兜底门禁，避免编译错误/回归推迟到打 tag 发版当天才暴露。
# 打 v* tag 的发版构建走 android-release.yml，不在这里。
on:
  push:
    branches: [ main ]
    # 纯文档/资源改动不影响构建产物，跳过 CI 省时间（public 仓库虽不扣额度，但省 11 分钟等待）。
    # 注意：只要本次 push 含任一非忽略路径的改动，CI 仍会触发。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'

# 同分支新提交到来时取消正在跑的旧 run，省 CI 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 在配置阶段取
          # git rev-list --count HEAD，浅克隆（默认 depth=1）会得到 1，必须拉完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 用只读缓存，仅 main 的 push 写回缓存，避免被 PR 污染。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 迁移版本号对账：编号连续、SCHEMA_VERSION 一致、已发布迁移未被篡改/复用
      # （hotfix 合流后 main 未把未发布迁移后移会在这里被拦）。
      - name: Check migration versions
        run: python3 scripts/check_migrations.py

      # 插件 host 方法表对账：宿主 PluginRuntimeManager 的 host.* 分支与
      # plugins/sdk/types/host.d.ts 的 HostMethodMap 必须一一对应，改宿主忘改 SDK 会在这里被拦。
      - name: Check plugin host methods
        run: node scripts/check-host-methods.mjs

      # 插件页面桥对账：PluginWebBridge / PluginOverlayBridge 的 dispatch 分支与
      # assets/plugin-ui/aicode.js 的 call(...) 必须一一对应，否则运行期 METHOD_UNKNOWN。
      - name: Check plugin page bridge
        run: node scripts/check-page-bridge.mjs

      # 插件清单校验：用 plugins/schema/plugin.schema.json 校验仓库内所有 plugin.json，
      # 字段写错在 CI 就暴露，不用等装到设备上被 PluginManifestParser 拒绝。
      - name: Check plugin manifests
        run: node scripts/check-plugin-manifests.mjs

      # 镜像目录同步脚本的离线自测：锁住 Alpine/Ubuntu/Debian 三套解析器对上游格式的假设，
      # 上游改版式时在 PR 阶段就暴露，而不是等每日定时任务悄悄失败。
      - name: Self-test container image sync script
        run: python3 scripts/sync-container-images.py --self-test

      # 单 flavor 冒烟：只构 universal debug（CLAUDE.md 规范：AI 改完编译型代码默认跑这个），
      # 不构全量三 flavor，省三倍 Kotlin 编译。
      - name: Build universal debug (smoke)
        run: ./gradlew :app:assembleUniversalDebug --stacktrace

      # 单元测试（app/src/test 下的 Kotlin 单测）。
      # 只跑 universal debug 变体：单测逻辑与 flavor 无关（flavor 仅影响 abiFilters/assets），
      # 跑全 flavor 6 变体是重复编译，无额外覆盖。
      - name: Run unit tests
        run: ./gradlew :app:testUniversalDebugUnitTest
